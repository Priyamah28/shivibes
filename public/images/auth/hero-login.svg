<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d32"/>
      <stop offset="45%" stop-color="#274a3d"/>
      <stop offset="100%" stop-color="#1f4236"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#cfa54f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cfa54f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#6aab8f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6aab8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bc9b5"/>
      <stop offset="100%" stop-color="#3a735c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow1)"/>
  <rect width="900" height="1200" fill="url(#glow2)"/>
  <!-- botanical leaves -->
  <ellipse cx="120" cy="200" rx="180" ry="90" fill="url(#leaf)" opacity="0.12" transform="rotate(-25 120 200)"/>
  <ellipse cx="780" cy="320" rx="220" ry="100" fill="url(#leaf)" opacity="0.1" transform="rotate(20 780 320)"/>
  <ellipse cx="650" cy="900" rx="260" ry="120" fill="url(#leaf)" opacity="0.14" transform="rotate(-8 650 900)"/>
  <!-- product jars silhouette -->
  <rect x="280" y="420" width="120" height="200" rx="24" fill="#ffffff" opacity="0.06"/>
  <rect x="300" y="400" width="80" height="28" rx="14" fill="#ffffff" opacity="0.08"/>
  <rect x="420" y="460" width="100" height="170" rx="22" fill="#ffffff" opacity="0.05"/>
  <rect x="435" y="445" width="70" height="24" rx="12" fill="#ffffff" opacity="0.07"/>
  <rect x="540" y="430" width="110" height="190" rx="26" fill="#ffffff" opacity="0.07"/>
  <rect x="558" y="412" width="74" height="26" rx="13" fill="#ffffff" opacity="0.09"/>
  <!-- herbs bowl -->
  <ellipse cx="450" cy="720" rx="200" ry="48" fill="#cfa54f" opacity="0.15"/>
  <path d="M350 720 Q450 640 550 720 Q450 780 350 720Z" fill="url(#leaf)" opacity="0.35"/>
  <circle cx="400" cy="700" r="8" fill="#9bc9b5" opacity="0.5"/>
  <circle cx="450" cy="685" r="6" fill="#cfa54f" opacity="0.6"/>
  <circle cx="500" cy="705" r="7" fill="#6aab8f" opacity="0.5"/>
  <!-- decorative dots -->
  <circle cx="150" cy="550" r="3" fill="#cfa54f" opacity="0.4"/>
  <circle cx="720" cy="480" r="4" fill="#9bc9b5" opacity="0.35"/>
  <circle cx="180" cy="950" r="3" fill="#6aab8f" opacity="0.4"/>
</svg>

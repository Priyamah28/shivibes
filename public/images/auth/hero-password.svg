<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f4236"/>
      <stop offset="60%" stop-color="#2f5c4a"/>
      <stop offset="100%" stop-color="#213d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#cfa54f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#cfa54f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6aab8f"/>
      <stop offset="100%" stop-color="#274a3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <!-- lock -->
  <rect x="365" y="520" width="170" height="150" rx="20" fill="#ffffff" opacity="0.1"/>
  <path d="M400 520 V470 Q450 420 500 470 V520" stroke="#cfa54f" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
  <circle cx="450" cy="590" r="18" fill="#cfa54f" opacity="0.4"/>
  <rect x="430" y="600" width="40" height="35" rx="8" fill="#9bc9b5" opacity="0.35"/>
  <!-- secure leaves ring -->
  <circle cx="450" cy="580" r="130" fill="none" stroke="url(#leaf)" stroke-width="2" opacity="0.35"/>
  <circle cx="450" cy="580" r="170" fill="none" stroke="#cfa54f" stroke-width="1" opacity="0.2"/>
  <path d="M200 350 Q260 280 320 350 Q260 420 200 350Z" fill="url(#leaf)" opacity="0.3"/>
  <path d="M580 750 Q660 680 740 750 Q660 820 580 750Z" fill="url(#leaf)" opacity="0.25"/>
  <ellipse cx="720" cy="280" rx="140" ry="65" fill="url(#leaf)" opacity="0.1" transform="rotate(18 720 280)"/>
</svg>
